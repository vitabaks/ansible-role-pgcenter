name: Ansible-lint

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Git clone repo ansible-role-pgcenter
      uses: actions/checkout@v4

    - name: Lint Ansible Playbook "ansible-role-pgcenter". Commit ${{ github.sha }}
      uses: ansible/ansible-lint@v26.4.0
      with:
        args: "tasks/main.yml"
